<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loyobooking — Sign In</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="pole-stripe"></div>
  <div class="center-wrap">
    <div class="card auth-card">
      <h1>Loyobooking</h1>
      <p class="tagline">Book your next cut in seconds.</p>

      <div class="tabs">
        <div class="tab active" id="tab-login">Sign In</div>
        <div class="tab" id="tab-register">New Customer</div>
      </div>

      <!-- LOGIN FORM (owner, barber, or customer) -->
      <form id="login-form">
        <label for="login-username">Username</label>
        <input id="login-username" type="text" required autocomplete="username">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" required autocomplete="current-password">
        <button class="btn-primary" type="submit">Sign In</button>
      </form>

      <!-- REGISTER FORM (customers only) -->
      <form id="register-form" style="display:none;">
        <label for="reg-name">Full name</label>
        <input id="reg-name" type="text" required>
        <label for="reg-phone">Phone</label>
        <input id="reg-phone" type="tel">
        <label for="reg-username">Choose a username</label>
        <input id="reg-username" type="text" required autocomplete="username">
        <label for="reg-password">Choose a password</label>
        <input id="reg-password" type="password" required minlength="6" autocomplete="new-password">
        <p class="hint">At least 6 characters.</p>
        <button class="btn-primary" type="submit">Create Account</button>
      </form>

      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
