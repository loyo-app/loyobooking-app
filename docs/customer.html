<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loyobooking — My Bookings</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="pole-stripe"></div>
  <div class="topbar">
    <h2 class="brand">Loyo<span>booking</span></h2>
    <button class="logout-btn" id="logout-btn">Log Out</button>
  </div>

  <div class="wrap">
    <h3 class="section-title">Book an Appointment</h3>
    <div class="card">
      <form id="booking-form">
        <div class="grid-2">
          <div>
            <label for="barber-select">Choose your barber</label>
            <select id="barber-select" required></select>
          </div>
          <div>
            <label for="service-select">Service</label>
            <select id="service-select" required></select>
          </div>
        </div>
        <div class="grid-2">
          <div>
            <label for="date-input">Date</label>
            <input id="date-input" type="date" required>
          </div>
          <div>
            <label for="time-input">Time</label>
            <input id="time-input" type="time" required>
          </div>
        </div>
        <button class="btn-primary" type="submit">Confirm Booking</button>
      </form>
      <div class="msg" id="booking-msg"></div>
    </div>

    <h3 class="section-title">My Upcoming &amp; Past Bookings</h3>
    <div class="card">
      <div id="bookings-container"><p class="empty-state">Loading…</p></div>
    </div>
  </div>

  <script type="module" src="js/customer.js"></script>
</body>
</html>
